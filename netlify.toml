# O build do nitro (preset netlify) coloca o estático em dist/ e a função de
# SSR em .netlify/functions-internal/server, que o Netlify detecta sozinho.
# O roteamento das telas não usa _redirects: a própria função declara path = "/*" com
# preferStatic, então arquivo estático ganha e o resto cai no SSR.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Endereços antigos das telas, para favoritos e links salvos continuarem
# funcionando depois que as URLs passaram a ter o nome de cada tela.
[[redirects]]
  from = "/auth"
  to = "/entrar"
  status = 301
  force = true

